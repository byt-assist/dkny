<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DKNY — Careers</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0A0A0A; color: #FFFFFF; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px; }
        .page-hero { padding: 120px 0 60px; text-align: center; }
        .page-title { font-family: 'Playfair Display', serif; font-size: 56px; }
        .page-title span { color: #D4AF37; }
        .career-list { max-width: 800px; margin: 40px auto; }
        .career-item { display: flex; justify-content: space-between; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .career-item h3 { font-size: 18px; }
        .career-item p { opacity: 0.5; font-size: 14px; }
        .back-link { display: inline-block; margin-top: 40px; color: #D4AF37; }
    </style>
</head>
<body>
    <div class="page-hero">
        <h1 class="page-title"><span>Careers</span></h1>
        <p style="opacity:0.6;font-size:18px;">Join the future of brand finance</p>
    </div>
    <div class="container">
        <div class="career-list">
            <div class="career-item">
                <div><h3>Smart Contract Developer</h3><p>Solana / Rust</p></div>
                <span style="color:#D4AF37;">Remote</span>
            </div>
            <div class="career-item">
                <div><h3>UI/UX Designer</h3><p>Web3 / Branding</p></div>
                <span style="color:#D4AF37;">Remote</span>
            </div>
            <div class="career-item">
                <div><h3>Marketing Lead</h3><p>DeFi / Luxury</p></div>
                <span style="color:#D4AF37;">Remote</span>
            </div>
            <div class="career-item">
                <div><h3>Community Manager</h3><p>Telegram / Twitter</p></div>
                <span style="color:#D4AF37;">Remote</span>
            </div>
        </div>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
